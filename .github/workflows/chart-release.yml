name: Release Chart

# Triggers only when the chart's Chart.yaml is modified on main — usually a
# version bump. chart-releaser-action is a no-op if the version hasn't changed
# but the path filter avoids running the workflow at all on unrelated pushes.
on:
  push:
    branches:
      - main
    paths:
      - 'charts/ai-proxy/Chart.yaml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      chart_version: ${{ steps.chart_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Read chart version
        id: chart_version
        run: |
          version=$(grep '^version:' charts/ai-proxy/Chart.yaml | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Wait for chart to appear in index
        run: |
          version="${{ needs.release.outputs.chart_version }}"
          for i in $(seq 1 10); do
            if curl -sf https://jo-hoe.github.io/ai-proxy/index.yaml | grep -q "version: $version"; then
              echo "Chart $version is available in index"
              exit 0
            fi
            echo "Attempt $i: $version not yet in index, waiting 20s..."
            sleep 20
          done
          echo "Chart $version not available after retries — Pages may be delayed"
          exit 1
