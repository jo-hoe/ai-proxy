name: Retry Pages Deployment

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [gh-pages]

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Check retry count and retrigger
        run: |
          msg="${{ github.event.workflow_run.head_commit.message }}"
          # Extract current attempt number from commit message, default to 0
          attempt=$(echo "$msg" | grep -oP '(?<=retry )\d+(?=/5)' || echo "0")
          if [ "$attempt" -ge 5 ]; then
            echo "Reached maximum retry attempts (5), giving up."
            exit 0
          fi
          next=$((attempt + 1))
          git commit --allow-empty -m "ci: retrigger Pages deployment (retry ${next}/5)"
          git push origin gh-pages
