name: Retry Pages Deployment

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [gh-pages]

jobs:
  retry:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      !contains(github.event.workflow_run.head_commit.message, 'ci: retrigger Pages deployment')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Retrigger Pages deployment
        run: |
          git commit --allow-empty -m "ci: retrigger Pages deployment"
          git push origin gh-pages
