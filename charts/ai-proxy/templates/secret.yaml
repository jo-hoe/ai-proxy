{{- if not .Values.oidc.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-proxy.fullname" . }}-token
  labels:
    {{- include "ai-proxy.labels" . | nindent 4 }}
type: Opaque
## Data keys are emitted ONLY when their value is non-empty. In secretless
## mode no keys are rendered, and the proxy fills them in at runtime via the
## k8s Secret patch (POST /token / rotation). Because empty keys are never
## emitted here, Helm's 3-way merge on `helm upgrade` will not delete the
## keys the proxy wrote — the persisted token survives chart upgrades.
{{- $data := dict }}
{{- if .Values.oidc.endpoint }}
{{- $_ := set $data "oidc-endpoint" .Values.oidc.endpoint }}
{{- end }}
{{- if .Values.oidc.clientId }}
{{- $_ := set $data "oidc-client-id" .Values.oidc.clientId }}
{{- end }}
{{- if .Values.oidc.refreshToken }}
{{- $_ := set $data "refresh-token" .Values.oidc.refreshToken }}
{{- end }}
{{- if $data }}
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end -}}
