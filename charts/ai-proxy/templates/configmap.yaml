apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-proxy.fullname" . }}-config
  labels:
    {{- include "ai-proxy.labels" . | nindent 4 }}
data:
  config.yaml: |
    upstream_url: {{ required "config.upstream_url is required" .Values.config.upstream_url | quote }}
    rotation_margin_seconds: {{ .Values.config.rotation_margin_seconds }}
