apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-proxy.fullname" . }}-config
  labels:
    {{- include "ai-proxy.labels" . | nindent 4 }}
data:
  config.yaml: |
    upstream_url: {{ required "config.upstreamUrl is required" .Values.config.upstreamUrl | quote }}
    rotation_margin_seconds: {{ .Values.config.rotationMarginSeconds }}
    {{- with .Values.config.clientVersion }}
    client_version: {{ . | quote }}
    {{- end }}
