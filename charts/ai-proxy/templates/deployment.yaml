apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-proxy.fullname" . }}
  labels:
    {{- include "ai-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-proxy.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: ai-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: proxy
              containerPort: {{ .Values.service.proxyPort }}
              protocol: TCP
            - name: mgmt
              containerPort: {{ .Values.service.mgmtPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /status
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config.yaml
              subPath: config.yaml
              readOnly: true
            - name: token
              mountPath: /run/secrets
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-proxy.fullname" . }}-config
        - name: token
          secret:
            secretName: {{ include "ai-proxy.tokenSecretName" . }}
            # Optional so the pod starts even without the secret; the proxy
            # will then wait for a manual POST /token via the management API.
            optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
