apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-proxy.fullname" . }}
  labels:
    {{- include "ai-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-proxy.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.rbac.enabled }}
      serviceAccountName: {{ include "ai-proxy.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.rbac.enabled }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: proxy
              containerPort: {{ .Values.service.proxyPort }}
              protocol: TCP
            - name: mgmt
              containerPort: {{ .Values.service.mgmtPort }}
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: {{ .Values.config.log_level | quote }}
            {{- if .Values.oidc.persistSecret }}
            - name: PERSIST_SECRET_NAME
              value: {{ include "ai-proxy.tokenSecretName" . }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /status
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /config.yaml
              subPath: config.yaml
              readOnly: true
            - name: token
              mountPath: /run/secrets/oidc-endpoint
              subPath: oidc-endpoint
              readOnly: true
            - name: token
              mountPath: /run/secrets/oidc-client-id
              subPath: oidc-client-id
              readOnly: true
            - name: token
              mountPath: /run/secrets/refresh-token
              subPath: refresh-token
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-proxy.fullname" . }}-config
        - name: token
          secret:
            secretName: {{ include "ai-proxy.tokenSecretName" . }}
            # Optional so the pod starts even without the secret; the proxy
            # will then wait for a manual POST /token via the management API.
            optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
