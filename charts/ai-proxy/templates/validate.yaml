{{- if .Values.oidc.persistSecret -}}
{{- if and (not .Values.oidc.endpoint) (not .Values.oidc.existingSecret) -}}
{{- fail "oidc.persistSecret=true requires a secret to exist, but neither oidc.endpoint nor oidc.existingSecret is set. Either supply OIDC credentials (oidc.endpoint + oidc.clientId + oidc.refreshToken) so the chart creates the secret, or point oidc.existingSecret at a pre-existing secret. Set oidc.persistSecret=false to use the manual POST /token flow without persistence." -}}
{{- end -}}
{{- if not .Values.rbac.enabled -}}
{{- fail "oidc.persistSecret=true requires rbac.enabled=true to create the Role/RoleBinding that allows the proxy to patch the Secret." -}}
{{- end -}}
{{- if gt (int .Values.replicaCount) 1 -}}
{{- fail "oidc.persistSecret=true is not safe with replicaCount > 1: multiple pods would race to PATCH the same Secret on every token rotation. Use replicaCount=1 or disable persistSecret." -}}
{{- end -}}
{{- end -}}
{{- if gt (int .Values.replicaCount) 1 -}}
{{- if and (not .Values.oidc.endpoint) (not .Values.oidc.existingSecret) -}}
{{- fail "replicaCount > 1 requires OIDC credentials to be mounted (oidc.endpoint or oidc.existingSecret). With multiple replicas, POST /token only reaches one pod — the others never activate. Mount credentials via a Secret so all pods auto-activate on startup." -}}
{{- end -}}
{{- end -}}
{{- if le (int .Values.config.rotation_margin_seconds) 0 -}}
{{- fail "config.rotation_margin_seconds must be a positive integer." -}}
{{- end -}}
{{- $validLevels := list "DEBUG" "INFO" "WARN" "ERROR" -}}
{{- if not (has (upper .Values.config.log_level) $validLevels) -}}
{{- fail (printf "config.log_level %q is invalid. Must be one of: DEBUG, INFO, WARN, ERROR" .Values.config.log_level) -}}
{{- end -}}
